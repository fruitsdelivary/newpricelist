    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f7f9fb; -webkit-font-smoothing: antialiased; }
        .flex-row-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; border-bottom: 1px solid #f0f0f0; transition: background-color 0.2s;
        }
        .item-name-part { flex: 1.2; text-align: right; font-weight: 600; font-size: 1.05rem; }
        
        /* حل نهائي لتداخل الأسعار على الآيفون */
        .item-price-part { 
            flex: 1; display: flex; align-items: center; justify-content: flex-end; 
            gap: 15px; min-width: 120px;
        }
        .old-price { color: #9ca3af; text-decoration: line-through; font-size: 0.8rem; white-space: nowrap; }
        .current-price { color: #dc2626; font-weight: 800; font-size: 1.15rem; white-space: nowrap; }

        .item-action-part { flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 8px; }

        .quantity-select { 
            height: 38px; width: 95px; border: 2px solid #22c55e; border-radius: 8px; 
            font-weight: bold; background-color: #fff; font-size: 0.8rem; text-align: center;
        }

        .not-available { opacity: 0.4; pointer-events: none; background-color: #fcfcfc; }
        .out-of-stock-msg { color: #dc2626; font-size: 0.75rem; font-weight: bold; }
        .offer-badge { background: #ef4444; color: white; padding: 1px 6px; border-radius: 99px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body class="p-2 md:p-8 text-right" dir="rtl">

            <a href="http://wa.me/201032872750" class="w-full bg-green-500 text-white font-bold py-4 rounded-2xl inline-block shadow-md mb-4 text-lg">📨 مراسلة واتساب مباشرة</a>
            <a href="https://www.facebook.com/share/1HkZeEoRr3/" class="w-full bg-blue-700 text-white font-bold py-4 rounded-2xl inline-block shadow-md mb-8 text-lg">🔵 زيارة صفحة الفيسبوك</a>
            
            <div class="mt-6 flex justify-center opacity-70">
                <img src="https://counter1.optistats.ovh/private/freecounterstat.php?c=4c8kqkxygt8km1fw7qfsjmr2ktzj1qwf" border="0" title="عداد الزيارات">
            </div>
        </footer>
    </div>

    <script>
        const productsData = [
            { name: "بصل أحمر", price: 20, unit: "كجم", category: "veg", available: true },
            { name: "ثوم بلدي", price: 40, unit: "كجم", category: "veg", available: true },
            { name: "بطاطس تحمير", price: 20, unit: "كجم", category: "veg", available: true },
            { name: "بطاطس صغيرة", price: 15, unit: "كجم", category: "veg", available: true },
            { name: "باذنجان مكبب", price: 30, unit: "كجم", category: "veg", available: true },

            { name: "ليمون 2", price: 40, unit: "كجم", category: "veg", available: true },
            { name: "فلفل أخضر بارد", price: 40, oldPrice: 50, unit: "كجم", category: "veg", available: true },
            { name: "فلفل أخضر حار", price: 40, unit: "كجم", category: "veg", available: true },
            { name: "فلفل أحمر بارد", price: 60, unit: "كجم", category: "veg", available: true },
            { name: "فلفل ألوان", price: 80,oldPrice: 100, unit: "كجم", category: "veg", available: true },
            { name: "سبانخ", price: 10, unit: "حزمة", category: "veg", available: true },
            { name: "خس بلدي", price: 12.5, unit: "حزمة", category: "veg", available: true },
            { name: "شبت وكسبرة", price: 10, unit: "ربطة", category: "veg", available: true },
            { name: "بقدونس", price: 10, unit: "ربطة", category: "veg", available: true },
            { name: "فجل", price: 5, unit: "ربطة", category: "veg", available: true },

            { name: "بصل أخضر", price: 10, unit: "ربطة", category: "veg", available: true },
            { name: "كرات مصري", price: 5, unit: "ربطة", category: "veg", available: true },
            { name: "خس كابوتشا", price: 30, unit: "حبة", category: "veg", available: true },
            { name: "زنجبيل فريش", price: 280, unit: "كجم", category: "veg", available: true },
            { name: "بنجر", price: 30, unit: "كجم", category: "veg", available: true },
            { name: "بصل أبيض ", price: 15, unit: "كجم", category: "veg", available: true },
            { name: "كرنب أحمر (سلطة)", price: 35, unit: "حبة", category: "veg", available: true },
            { name: "كرنب أبيض (سلطة)", price: 40, unit: "حبة", category: "veg", available: true },
            { name: "مشروم فريش", price: 50, oldPrice: 60, unit: "طبق", category: "veg", available: false },
            { name: " أرز رويزق 10ك", price: 315, oldPrice: 320, unit: "شيكارة", category: "veg", available: true },
            { name: "مـوز", price: 35, unit: "كجم", category: "fruit", available: true },
            { name: "تفاح أصفر", price: 100, unit: "كجم", category: "fruit", available: true },
            { name: "تفاح سكري", price: 100, unit: "كجم", category: "fruit", available: true },
            { name: "تفاح أحمر إيطالي", price: 130, unit: "كجم", category: "fruit", available: true },
            { name: "فراولة", price: 30, unit: "كجم", category: "fruit", available: false },
            { name: "كيوي", price: 160, unit: "كجم", category: "fruit", available: true },
            { name: "برتقال بصره", price: 30, unit: "كجم", category: "fruit", available: true },
            { name: "جوافة", price: 40, unit: "كجم", category: "fruit", available: true },
            { name: "يوسفي موركت", price: 25, unit: "كجم", category: "fruit", available: true },
            { name: "كنتالوب", price: 35, oldPrice: 40, unit: "كجم", category: "fruit", available: true },
            { name: "تمر القصيم (١ك)", price: 125, unit: "علبة", category: "fruit", available: true },
            { name: "برتقال عصير", price: 20, unit: "كجم", category: "fruit", available: true },
{ name: "بطيخ جيزة", price: 110, unit: "حبة", category: "fruit", available: true },
            { name: "خوخ بلدي", price: 80, unit: "كجم", category: "fruit", available: true },
            { name: "خوخ سكري", price: 100, unit: "كجم", category: "fruit", available: true }
        ];

        function init() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true };
            document.getElementById('date-display').innerText = now.toLocaleDateString('ar-EG', options).replace(" في ", " - ");

            let sVeg = '', sFruit = '', iAll = '';
            productsData.forEach(p => {
                const badge = p.oldPrice ? `<br><span class="offer-badge">عرض 🔥</span>` : '';
                const priceDiv = `<div class="item-price-part">
                                    ${p.oldPrice ? `<span class="old-price">${p.oldPrice} ج</span>` : ''}
                                    <span class="current-price">${p.price} ج</span>
                                  </div>`;
                
                // نسخة قائمة الأسعار
                const sRow = `<div class="flex-row-item ${p.available ? '' : 'not-available'}">
                                <div class="item-name-part">${p.name}${badge} ${p.available ? '' : '<span class="out-of-stock-msg"> (غير متوفر)</span>'}</div>
                                ${p.available ? priceDiv : '<div class="text-red-500 font-bold text-xs">---</div>'}
                              </div>`;
                
                // نسخة صفحة الطلب (مع السعر)
                const iRow = `<div class="flex-row-item ${p.available ? '' : 'not-available'}">
                                <div class="item-name-part text-sm">${p.name} <br> <span class="text-green-600 font-bold text-xs">${p.price} ج / ${p.unit}</span></div>
                                <div class="item-action-part">
                                    ${p.available ? `<select class="quantity-select" data-unit="${p.unit}" data-name="${p.name}"></select>` : '<span class="text-red-500 font-bold text-xs">غير متوفر</span>'}
                                </div>
                              </div>`;

                if (p.category === 'veg') sVeg += sRow; else sFruit += sRow;
                iAll += iRow;
            });
            document.getElementById('vegetables-list-static').innerHTML = sVeg;
            document.getElementById('fruits-list-static').innerHTML = sFruit;
            document.getElementById('interactive-lists-combined').innerHTML = iAll;

            // توليد خيارات الكمية: كسور، ثم (من 1 لـ 10 بالكسور)، ثم (من 11 لـ 25 صحيح)
document.querySelectorAll('.quantity-select').forEach(s => {
    let opts = '<option value="0">-- طلب --</option>';
    const unit = s.dataset.unit;
    
    if (unit === 'كجم') {
        const weights = [];
        
        // 1. الكسور الأقل من كيلو
        weights.push({ val: 0.125, text: '⅛ك' });
        weights.push({ val: 0.25,  text: '¼ك' });
        weights.push({ val: 0.5,   text: '½ك' });
        weights.push({ val: 0.75,  text: '¾ك' });

        // 2. من 1 كيلو إلى 10 كيلو مع الكسور (1، 1و¼، 1و½، 1و¾...)
        for (let i = 1; i <= 10; i++) {
            weights.push({ val: i, text: i + 'ك' });
            if (i < 10) { // إضافة الكسور حتى نصل للرقم 10
                weights.push({ val: i + 0.25, text: i + 'و¼ك' });
                weights.push({ val: i + 0.5,  text: i + 'و½ك' });
                weights.push({ val: i + 0.75, text: i + 'و¾ك' });
            }
        }

        // 3. من 11 كيلو إلى 25 كيلو (أرقام صحيحة فقط)
        for (let i = 11; i <= 25; i++) {
            weights.push({ val: i, text: i + 'ك' });
        }
        
        weights.forEach(w => {
            opts += `<option value="${w.val}">${w.text}</option>`;
        });
    } else {
        // للوحدات الأخرى (ربطة، قطعة، إلخ)
        for(let i=1; i<=20; i++) {
            opts += `<option value="${i}">${i} ${unit}</option>`;
        }
    }
    s.innerHTML = opts;
});

        }

        function toggleView(v) {
            document.getElementById('price-list-view').style.display = v === 'order-form-view' ? 'none' : 'block';
            document.getElementById('order-form-view').style.display = v === 'order-form-view' ? 'block' : 'none';
            document.getElementById('main-title').textContent = v === 'order-form-view' ? '🛒 نموذج طلب واتساب' : '💰أسعار اليوم💰';
            window.scrollTo(0,0);
        }

        function generateWhatsAppOrder() {
    let vegItems = '';
    let fruitItems = '';
    let count = 0;

    // المرور على جميع القوائم المنسدلة
    document.querySelectorAll('.quantity-select').forEach(s => {
        if (s.value != "0") {
            const itemName = s.dataset.name;
            const quantityText = s.options[s.selectedIndex].text;
            const itemLine = `• ${quantityText} ${itemName}\n`;
            
            // البحث عن نوع الصنف (خضار أم فاكهة) من البيانات الأصلية
            const product = productsData.find(p => p.name === itemName);
            if (product && product.category === 'veg') {
                vegItems += itemLine;
            } else {
                fruitItems += itemLine;
            }
            count++;
        }
    });

    if (count === 0) return alert("من فضلك اختر صنف واحد على الأقل!");

    // بناء نص الرسالة بنفس تنسيق الصورة
    let msg = '📝 *طلب جديد عبر قائمة الأسعار التفاعلية:*\n';
    msg += '------------------\n\n';
    if (vegItems) {
        msg += '🥬 *الخضروات:*\n' + vegItems + '\n';
    }
    if (fruitItems) {
        msg += '🍏 *الفواكه:*\n' + fruitItems + '\n';
    }
    msg += '------------------\n';
    const notes = document.getElementById('notes').value;
    msg += `📌 *الملاحظات والعنوان:*\n${notes || 'لا يوجد'}`;

    // إرسال للواتساب
    window.open(`https://wa.me/201032872750?text=${encodeURIComponent(msg)}`);
}
        window.onload = init;
    </script>
