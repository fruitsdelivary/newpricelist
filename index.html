    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f7f9fb; }
        .static-row, .interactive-row { transition: background-color 0.2s; border-bottom: 1px solid #f0f0f0; }
        .static-row:hover, .interactive-row:hover { background-color: #f3f4f6; }
        
        .quantity-select { 
            height: 34px; 
            min-width: 85px; 
            text-align-last: center; 
            border: 2px solid #22c55e; 
            border-radius: 6px; 
            appearance: none; 
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2315803d' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); 
            background-repeat: no-repeat; 
            background-position: left 0.3rem center; 
            background-size: 0.8em; 
            padding-left: 1.2rem; 
            font-weight: bold;
            background-color: #fff;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .offer-badge { 
            display: inline-block;
            background: linear-gradient(to right, #ef4444, #b91c1c); 
            color: white; padding: 1px 8px; border-radius: 9999px; 
            font-size: 10px; font-weight: bold; 
            margin-top: 2px; animation: pulse 1.5s infinite; 
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } }

    <script>
        const productsData = [

        ];

        const WHATSAPP_NUMBER = '201032872750';

        function displayCurrentDateTime() {
            const now = new Date();
            const options = { 
                weekday: 'long', year: 'numeric', month: 'long', 
                day: 'numeric', hour: '2-digit', minute: '2-digit'
            };
            const formatter = new Intl.DateTimeFormat('ar-EG', options);
            document.getElementById('date-display').textContent = formatter.format(now);
        }

        function generatePriceList() {
            let sVeg = '', sFruit = '', iVeg = '', iFruit = '';
            productsData.forEach(p => {
                const badge = p.oldPrice ? `<br><span class="offer-badge">عرض 🔥</span>` : '';
                const priceHTML = p.oldPrice ? `<span class="text-gray-400 line-through text-xs ml-1">${p.oldPrice}</span><span class="text-red-600 font-bold">${p.price} ج</span>` : `<span>${p.price} ج</span>`;
                
                const sRow = `<tr class="static-row" data-name="${p.name}"><td class="px-4 py-3 text-lg font-medium">${p.name}${badge}</td><td class="px-4 py-3 text-xl font-bold text-right">${priceHTML}</td></tr>`;
                const iRow = `<tr class="interactive-row" data-name="${p.name}" data-unit="${p.unit}">
                    <td class="px-4 py-3 text-lg font-medium">${p.name}${badge}</td>
                    <td class="px-4 py-3 text-center font-bold text-green-700 text-sm align-middle">${priceHTML}</td>
                    <td class="px-4 py-3 align-middle w-[100px]"><select class="quantity-select w-full" data-unit="${p.unit}"></select></td>
                </tr>`;
                
                if (p.category === 'vegetable') { sVeg += sRow; iVeg += iRow; } else { sFruit += sRow; iFruit += iRow; }
            });
            document.getElementById('vegetables-tbody-static').innerHTML = sVeg;
            document.getElementById('fruits-tbody-static').innerHTML = sFruit;
            document.getElementById('vegetables-tbody-interactive').innerHTML = iVeg;
            document.getElementById('fruits-tbody-interactive').innerHTML = iFruit;
        }

        function generateWeightOptions(unit) {
            let options = '<option value="0" selected>-- طلب --</option>';
            if (unit === 'كجم') {
                const weights = [
                    { val: 0.125, text: '⅛ ك' }, { val: 0.25, text: '¼ ك' }, 
                    { val: 0.5, text: '½ ك' }, { val: 0.75, text: '¾ ك' }
                ];
                for (let i = 1; i <= 15; i++) {
                    weights.push({ val: i, text: i + ' ك' });
                    if (i < 15) { 
                        weights.push({ val: i + 0.125, text: i + ' و⅛ ك' });
                        weights.push({ val: i + 0.25, text: i + ' و¼ ك' });
                        weights.push({ val: i + 0.5, text: i + ' و½ ك' });
                        weights.push({ val: i + 0.75, text: i + ' و¾ ك' });
                    }
                }
                weights.forEach(w => { options += `<option value="${w.val}">${w.text}</option>`; });
            } else {
                for (let i = 1; i <= 15; i++) { options += `<option value="${i}">${i} ${unit}</option>`; }
            }
            return options;
        }

        function toggleView(v) {
            document.getElementById('price-list-view').style.display = v === 'order-form-view' ? 'none' : 'block';
            document.getElementById('order-form-view').style.display = v === 'order-form-view' ? 'block' : 'none';
            document.getElementById('main-title').textContent = v === 'order-form-view' ? '🛒 نموذج طلب واتساب السريع' : '💰أسعار اليوم💰';
            window.scrollTo({top:0, behavior:'smooth'});
        }

        function generateWhatsAppOrder() {
            let vegStr = '', fruitStr = '', count = 0;
            document.querySelectorAll('#vegetables-tbody-interactive .interactive-row').forEach(row => {
                const sel = row.querySelector('.quantity-select');
                if (parseFloat(sel.value) > 0) { 
                    count++; 
                    vegStr += `- ${sel.options[sel.selectedIndex].text} ${row.getAttribute('data-name')}\n`; 
                }
            });
            document.querySelectorAll('#fruits-tbody-interactive .interactive-row').forEach(row => {
                const sel = row.querySelector('.quantity-select');
                if (parseFloat(sel.value) > 0) { 
                    count++; 
                    fruitStr += `- ${sel.options[sel.selectedIndex].text} ${row.getAttribute('data-name')}\n`; 
                }
            });
            if (count === 0) return alert('الرجاء اختيار صنف واحد على الأقل');
            let msg = `📝 *طلب جديد من قائمة الأسعار التفاعلية*:\n------------------\n`;
            if (vegStr) msg += `🥬 *الخضروات:*\n${vegStr}\n`;
            if (fruitStr) msg += `🍎 *الفواكه:*\n${fruitStr}\n`;
            msg += `------------------\n📌 *الملاحظات والعنوان:*\n${document.getElementById('notes').value || 'لا يوجد'}`;
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function filterItems(type) {
            const val = document.getElementById(type === 'static' ? 'search-input-static' : 'search-input-interactive').value.toLowerCase();
            document.querySelectorAll(type === 'static' ? '.static-row' : '.interactive-row').forEach(row => { 
                row.style.display = row.getAttribute('data-name').toLowerCase().includes(val) ? 'table-row' : 'none'; 
            });
        }

        document.addEventListener('DOMContentLoaded', () => { 
            displayCurrentDateTime();
            generatePriceList(); 
            document.querySelectorAll('.quantity-select').forEach(s => s.innerHTML = generateWeightOptions(s.getAttribute('data-unit')));
        });
    </script>
