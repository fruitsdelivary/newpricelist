<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دليفري الخضار والفاكهة..قائمة الأسعار ونموذج الطلب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f7f9fb; -webkit-font-smoothing: antialiased; }
        .static-row, .interactive-row { transition: background-color 0.2s; border-bottom: 1px solid #f0f0f0; }
        
        /* تنسيق خاص للقوائم المنسدلة في Safari */
        .quantity-select { 
            height: 40px; min-width: 95px; text-align: center; border: 2px solid #22c55e; border-radius: 8px; 
            -webkit-appearance: none; appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2315803d' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); 
            background-repeat: no-repeat; background-position: left 0.5rem center; background-size: 0.8em;
            padding: 0 0.5rem 0 1.5rem; font-weight: bold; background-color: #fff; cursor: pointer;
        }

        /* إصلاح تداخل النصوص في الجداول */
        table { width: 100%; table-layout: fixed; border-collapse: collapse; }
        td { overflow-wrap: break-word; vertical-align: middle; }

        .offer-badge { 
            display: inline-block; background: linear-gradient(to right, #ef4444, #b91c1c); 
            color: white; padding: 2px 8px; border-radius: 9999px; 
            font-size: 10px; font-weight: bold; animation: pulse 1.5s infinite; 
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        
        .star-rating button { font-size: 2rem; color: #d1d5db; }
        .star-rating button.active { color: #fbbf24; }
    </style>
</head>
<body class="p-2 md:p-8">

    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-2xl p-4 md:p-10 border-4 border-green-500/50">

        <header class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-green-700 mb-4" id="main-title">💰أسعار اليوم💰</h1>
            <div class="mb-6">
                <img src="https://i.ibb.co/3yfhVHXj/1764874410467.png" class="mx-auto w-24 h-24 rounded-full border-4 border-green-300 shadow-xl object-cover">
                <p class="text-lg font-bold text-gray-600 mt-2">خُبراء الخضار والفاكهة</p>
                <p id="date-display" class="text-md font-bold text-blue-600 mt-3 bg-blue-50 inline-block px-4 py-1 rounded-full border border-blue-200"></p>
            </div>
        </header>
        
        <div id="price-list-view">
            <button onclick="toggleView('order-form-view')" class="w-full mb-8 bg-blue-600 text-white font-bold py-4 rounded-xl shadow-xl text-xl active:scale-95 transition">
                🛒 ابدأ طلبك الآن! (نموذج الطلب السريع)
            </button>

            <div class="bg-red-100 text-red-800 font-extrabold p-3 rounded-xl border-4 border-red-500 mb-8 text-center text-xl animate-pulse">
                🔴 كل عام وأنتم بخير،، إجازة عيد الفطر المبارك 🎈 🔴
            </div>

            <section class="border-4 border-red-500 rounded-xl overflow-hidden shadow-lg mb-10">
                <h2 class="bg-red-600 text-white text-2xl font-bold p-4 text-center">📦 عروض الكميات للجملة</h2>
                <div class="p-1"><table class="min-w-full"><tbody id="wholesale-tbody-static" class="bg-red-50 divide-y"></tbody></table></div>
            </section>

            <section class="border rounded-xl overflow-hidden shadow-lg mb-10">
                <h2 class="bg-green-600 text-white text-2xl font-bold p-4 text-center">🥬🥦 خضروات 🥦🥬</h2>
                <div class="p-1"><table class="min-w-full"><tbody id="vegetables-tbody-static" class="bg-white divide-y"></tbody></table></div>
            </section>

            <section class="border rounded-xl overflow-hidden shadow-lg mb-10">
                <h2 class="bg-yellow-600 text-white text-2xl font-bold p-4 text-center">🍌🍎 فواكه 🍉🍇</h2>
                <div class="p-1"><table class="min-w-full"><tbody id="fruits-tbody-static" class="bg-white divide-y"></tbody></table></div>
            </section>
        </div>

        <div id="order-form-view" style="display: none;">
            <button onclick="toggleView('price-list-view')" class="w-full mb-6 bg-gray-400 text-white font-bold py-3 rounded-xl text-lg active:bg-gray-500">🔙 العودة للأسعار</button>
            <form id="order-form" onsubmit="event.preventDefault(); generateWhatsAppOrder();">
                <div id="interactive-sections"></div>

                <div class="bg-gray-50 p-6 rounded-xl text-center my-8 border-2 border-dashed border-gray-300">
                    <p class="font-bold text-gray-700 mb-2">ما تقييمك لخدماتنا؟</p>
                    <div class="star-rating flex justify-center gap-2" id="star-container">
                        <button type="button" onclick="setRating(1)">⭐</button>
                        <button type="button" onclick="setRating(2)">⭐</button>
                        <button type="button" onclick="setRating(3)">⭐</button>
                        <button type="button" onclick="setRating(4)">⭐</button>
                        <button type="button" onclick="setRating(5)">⭐</button>
                    </div>
                    <input type="hidden" id="rating-value" value="0">
                </div>

                <textarea id="notes" rows="4" placeholder="العنوان بالتفصيل ورقم الموبايل..." class="w-full p-4 border border-gray-300 rounded-lg text-right focus:ring-2 focus:ring-green-500 outline-none" dir="rtl"></textarea>
                <button type="submit" class="w-full mt-10 bg-green-700 text-white font-bold py-4 rounded-xl shadow-2xl active:scale-95 text-xl transition">إرسال الطلب عبر واتساب ✅</button>
            </form>
        </div>

        <footer class="mt-12 pt-6 border-t-2 text-center">
            <a href="http://wa.me/201032872750" class="bg-green-500 text-white font-bold py-3 px-6 rounded-full inline-block mb-4 shadow-md">📨 واتساب المبيعات</a>
        </footer>
    </div>

    <script>
        // هنا تضع مصفوفة المنتجات كاملة كما في الكود السابق
        // مع وظائف generatePriceList و setRating المحدثة
    </script>
</body>
</html>
