    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f7f9fb; -webkit-font-smoothing: antialiased; }
        .quantity-select { 
            height: 40px; min-width: 95px; border: 2px solid #22c55e; border-radius: 8px; 
            -webkit-appearance: none; appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2315803d' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");

            padding: 0 0.5rem 0 1.5rem; font-weight: bold; background-color: #fff;
        }
        table { width: 100%; table-layout: fixed; border-collapse: collapse; }
        .offer-badge { display: inline-block; background: linear-gradient(to right, #ef4444, #b91c1c); color: white; padding: 2px 8px; border-radius: 9999px; font-size: 10px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    </style>
