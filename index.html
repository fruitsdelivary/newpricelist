    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f7f9fb; -webkit-font-smoothing: antialiased; }
        
        /* نظام Flexbox البديل للجداول لضمان ثبات العرض على الآيفون */
        .flex-row-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            transition: background-color 0.2s;
        }
        .flex-row-item:hover { background-color: #f9fafb; }
        .item-name-part { flex: 2; text-align: right; font-weight: 600; font-size: 1.1rem; }
        .item-price-part { flex: 1; text-align: left; font-weight: 800; font-size: 1.2rem; }
        .item-action-part { flex: 1; display: flex; justify-content: flex-end; }

        /* تنسيق خاص للآيفون Safari */
        .quantity-select { 
            height: 40px; min-width: 95px; border: 2px solid #22c55e; border-radius: 8px; 
            -webkit-appearance: none; appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2315803d' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); 
            background-repeat: no-repeat; background-position: left 0.5rem center; background-size: 0.8em;
            padding: 0 0.5rem 0 1.5rem; font-weight: bold; background-color: #fff; font-size: 0.85rem; cursor: pointer;
        }

      /* حل مشكلة تداخل الأرقام على الآيفون */
        .item-price-part { flex: 1.5; text-align: left; display: flex; align-items: center; justify-content: flex-end; gap: 10px; white-space: nowrap; }
        .old-price { color: #9ca3af; text-decoration: line-through; font-size: 0.85rem; }
        .current-price { color: #dc2626; font-weight: 800; font-size: 1.2rem; }
        .quantity-select { 
            height: 38px; min-width: 90px; border: 2px solid #22c55e; border-radius: 8px; 
            font-weight: bold; background-color: #fff; font-size: 0.85rem;
        }
        .offer-badge { background: #ef4444; color: white; padding: 1px 6px; border-radius: 99px; font-size: 10px; font-weight: bold; margin-right: 5px; }
    </style>
</head>
<body class="p-2 md:p-8">

    <div class="max-w-3xl mx-auto bg-white rounded-3xl shadow-2xl p-4 border-4 border-green-500/20">

        <header class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-green-700

        /* تنسيق الأصناف غير المتوفرة */
        .not-available { opacity: 0.5; position: relative; }
        .not-available .item-name-part { text-decoration: line-through; color: #9ca3af; }
        .out-of-stock-label { color: #dc2626; font-size: 0.75rem; font-weight: bold; display: block; text-decoration: none !important; }

        .offer-badge { 
            display: inline-block; background: linear-gradient(to right, #ef4444, #b91c1c); 
            color: white; padding: 1px 8px; border-radius: 9999px; 
            font-size: 10px; font-weight: bold; margin-top: 2px; animation: pulse 1.5s infinite; 
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    </style>
</head>

    <script>
        // مصفوفة المنتجات كاملة (أضفت خاصية available لكل صنف)
        // لتغيير التوفر: اجعل available: false للصنف غير الموجود

            { name: "برتقال عصير", price: 20.0, unit: "كجم", category: "fruit", available: true },
            { name: "خوخ بلدي", price: 100.0, unit: "كجم", category: "fruit", available: true },
            { name: "خوخ سكري", price: 100.0, unit: "كجم", category: "fruit", available: true }
        ];

        const WHATSAPP_NUMBER = '201032872750';

        function displayCurrentDateTime() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date-display').textContent = now.toLocaleDateString('ar-EG', options);
        }

        function generatePriceList() {
            let sVeg = '', sFruit = '', iVeg = '', iFruit = '';
            productsData.forEach(p => {
                const isAvail = p.available !== false;
                const availClass = isAvail ? '' : 'not-available';
                const statusLabel = isAvail ? '' : '<span class="out-of-stock-label">غير متوفر حالياً</span>';
                
                const badge = p.oldPrice ? `<br><span class="offer-badge">عرض 🔥</span>` : '';
                const priceHTML = p.oldPrice 
                    ? `<span class="text-gray-400 line-through text-xs ml-1">${p.oldPrice}</span><span class="text-red-600 font-bold">${p.price} ج</span>` 
                    : `<span>${p.price} ج</span>`;
                
                // نسخة العرض (Flexbox)
                const sRow = `
                    <div class="flex-row-item ${availClass}" data-name="${p.name}">
                        <div class="item-name-part">${p.name}${badge}${statusLabel}</div>
                        <div class="item-price-part text-left">${isAvail ? priceHTML : '---'}</div>
                    </div>`;
                
                // نسخة الطلب (Flexbox)
                const iRow = `
                    <div class="flex-row-item ${availClass}" data-name="${p.name}" data-unit="${p.unit}">
                        <div class="item-name-part">${p.name}${statusLabel}</div>
                        <div class="item-price-part text-center text-green-700 text-sm">${isAvail ? priceHTML : ''}</div>
                        <div class="item-action-part">
                            ${isAvail ? `<select class="quantity-select" data-unit="${p.unit}"></select>` : '<span class="text-red-500 font-bold text-xs">اعتذر</span>'}
                        </div>
                    </div>`;
                
                if (p.category === 'vegetable') { sVeg += sRow; iVeg += iRow; } 
                else { sFruit += sRow; iFruit += iRow; }
            });
            document.getElementById('vegetables-list-static').innerHTML = sVeg;
            document.getElementById('fruits-list-static').innerHTML = sFruit;
            document.getElementById('vegetables-list-interactive').innerHTML = iVeg;
            document.getElementById('fruits-list-interactive').innerHTML = iFruit;
        }

        function generateWeightOptions(unit) {
            let options = '<option value="0" selected>-- طلب --</option>';
            if (unit === 'كجم' || unit === 'كيلو') {
                const weights = [{ val: 0.25, text: '¼ كيلو' }, { val: 0.5, text: '½ كيلو' }, { val: 0.75, text: '¾ كيلو' }];
                for (let i = 1; i <= 10; i++) {
                    weights.push({ val: i, text: i + ' كيلو' });
                    if (i < 10) { weights.push({ val: i + 0.5, text: i + ' ونصف' }); }
                }
                weights.forEach(w => { options += `<option value="${w.val}">${w.text}</option>`; });
            } else {
                for (let i = 1; i <= 10; i++) { options += `<option value="${i}">${i} ${unit}</option>`; }
            }
            return options;
        }

        function toggleView(v) {
            document.getElementById('price-list-view').style.display = v === 'order-form-view' ? 'none' : 'block';
            document.getElementById('order-form-view').style.display = v === 'order-form-view' ? 'block' : 'none';
            document.getElementById('main-title').textContent = v === 'order-form-view' ? '🛒 نموذج طلب واتساب' : '💰أسعار اليوم💰';
            window.scrollTo({top:0, behavior:'smooth'});
        }

        function generateWhatsAppOrder() {
            let orderStr = '', count = 0;
            document.querySelectorAll('#order-form-view .flex-row-item').forEach(row => {
                const sel = row.querySelector('.quantity-select');
                if (sel && parseFloat(sel.value) > 0) { 
                    count++; 
                    orderStr += `- ${sel.options[sel.selectedIndex].text} ${row.getAttribute('data-name')}\n`; 
                }
            });
            if (count === 0) return alert('الرجاء اختيار صنف واحد على الأقل');
            let msg = `📝 *طلب جديد*:\n------------------\n${orderStr}------------------\n📌 *الملاحظات:*\n${document.getElementById('notes').value || 'لا يوجد'}`;
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function filterItems(type) {
            const val = document.getElementById(type === 'static' ? 'search-input-static' : 'search-input-interactive').value.toLowerCase();
            document.querySelectorAll(type === 'static' ? '#price-list-view .flex-row-item' : '#order-form-view .flex-row-item').forEach(row => { 
                row.style.display = row.getAttribute('data-name').toLowerCase().includes(val) ? 'flex' : 'none'; 
            });
        }

        document.addEventListener('DOMContentLoaded', () => { 
            displayCurrentDateTime();
            generatePriceList(); 
            document.querySelectorAll('.quantity-select').forEach(s => s.innerHTML = generateWeightOptions(s.getAttribute('data-unit')));
        });
    </script>
