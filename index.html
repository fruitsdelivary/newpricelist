<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>دليفري الخضار والفاكهة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* إجبار الآيفون على استخدام الخطوط العربية بشكل صحيح */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f9fb;
            -webkit-text-size-adjust: 100%;
        }

        /* حل مشكلة القائمة المنسدلة في Safari - إزالة سهم آبل تماماً */
        .quantity-select { 
            -webkit-appearance: none !important; /* إجبار الإزالة */
            -moz-appearance: none !important;
            appearance: none !important;
            background-color: #ffffff !important;
            border: 2px solid #22c55e !important;
            border-radius: 10px !important;
            height: 44px !important; /* ارتفاع مريح للمس */
            width: 100% !important;
            padding: 0 10px !important;
            font-size: 16px !important; /* لمنع الزوم التلقائي */
            font-weight: bold !important;
            color: #15803d !important;
            text-align: center !important;
            /* إضافة سهم جديد خاص بنا لا يختفي */
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2315803d' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e") !important;
            background-repeat: no-repeat !important;
            background-position: left 8px center !important;
            background-size: 14px !important;
        }

        /* منع تداخل الجدول وبعثرة الأسعار */
        .items-table {
            display: table !important;
            width: 100% !important;
            border-collapse: collapse !important;
        }
        
        .items-table tr {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            padding: 12px 5px !important;
            border-bottom: 1px solid #eee !important;
        }

        .item-name { flex: 2; text-align: right; font-weight: 700; font-size: 17px; color: #374151; }
        .item-price { flex: 1; text-align: center; font-weight: 800; color: #dc2626; font-size: 18px; }
        .item-action { flex: 1; display: flex; justify-content: flex-end; }

        /* تحسين شكل الأزرار في iOS */
        .btn-order {
            -webkit-appearance: none;
            background-color: #2563eb !important;
            color: white !important;
            font-weight: 900 !important;
            border-radius: 15px !important;
            padding: 18px !important;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3) !important;
        }
    </style>
</head>
<body class="p-2 md:p-6">
    <div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">
        
        <div class="bg-white p-6 text-center">
            <h1 class="text-3xl font-black text-green-700 mb-2">💰 أسعار اليوم 💰</h1>
            <p id="date-display" class="text-blue-600 font-bold bg-blue-50 px-4 py-1 rounded-full inline-block mt-2"></p>
        </div>

        <div id="price-list-view" class="p-4">
            <button onclick="toggleView('order-form-view')" class="w-full btn-order text-xl mb-6">
                🛒 ابدأ طلبك الآن (نموذج سريع)
            </button>

            <div class="mb-8">
                <h2 class="bg-green-600 text-white text-xl font-bold p-3 rounded-t-xl text-center">🥬 خضروات طازجة</h2>
                <div class="border border-t-0 rounded-b-xl overflow-hidden">
                    <div id="veg-list" class="items-table"></div>
                </div>
            </div>
        </div>

        <div id="order-form-view" class="p-4" style="display:none;">
            <button onclick="toggleView('price-list-view')" class="w-full bg-gray-200 text-gray-700 font-bold py-3 rounded-xl mb-4">🔙 رجوع</button>
            <div id="order-items-list" class="items-table"></div>
            <textarea id="notes" class="w-full border-2 border-gray-200 rounded-xl p-4 mt-4 text-right" placeholder="العنوان وتفاصيل الطلب..."></textarea>
            <button onclick="generateWhatsAppOrder()" class="w-full bg-green-600 text-white font-black py-5 rounded-2xl mt-4 text-xl">إرسال عبر واتساب ✅</button>
        </div>

    </div>

    <script>
        const products = [
            { name: "بصل أحمر", price: 20.0, unit: "كجم", category: "veg" },
            { name: "بطاطس تحمير", price: 17.5, unit: "كجم", category: "veg" },
            { name: "طماطم جامدة", price: 50.0, unit: "كجم", category: "veg" }
            // ... أضف بقية الـ 60 صنفاً هنا بنفس النمط
        ];

        function render() {
            let vegHtml = '';
            let orderHtml = '';
            products.forEach(p => {
                vegHtml += `<tr>
                    <td class="item-name">${p.name}</td>
                    <td class="item-price">${p.price} ج</td>
                </tr>`;
                
                orderHtml += `<tr>
                    <td class="item-name">${p.name}</td>
                    <td class="item-action">
                        <select class="quantity-select" data-name="${p.name}" data-unit="${p.unit}">
                            ${getOptions(p.unit)}
                        </select>
                    </td>
                </tr>`;
            });
            document.getElementById('veg-list').innerHTML = vegHtml;
            document.getElementById('order-items-list').innerHTML = orderHtml;
        }

        function getOptions(unit) {
            let opt = '<option value="0">طلب</option>';
            for(let i=1; i<=10; i++) opt += `<option value="${i}">${i} ${unit}</option>`;
            return opt;
        }

        function toggleView(v) {
            document.getElementById('price-list-view').style.display = v === 'order-form-view' ? 'none' : 'block';
            document.getElementById('order-form-view').style.display = v === 'order-form-view' ? 'block' : 'none';
            window.scrollTo(0,0);
        }

        // التاريخ المتوافق مع iOS
        const now = new Date();
        document.getElementById('date-display').innerText = now.toLocaleDateString('ar-EG', {weekday:'long', day:'numeric', month:'long'});
        
        render();
    </script>
</body>
</html>
