<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دليفري الخضار والفاكهة..قائمة الأسعار ونموذج الطلب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f7f9fb; -webkit-font-smoothing: antialiased; }
        
        .flex-row-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; border-bottom: 1px solid #f0f0f0; transition: background-color 0.2s;
        }
        .item-name-part { flex: 1.2; text-align: right; font-weight: 600; font-size: 1.05rem; min-width: 0; }
        
        /* التعديل الجوهري لمنع تداخل الأسعار على الآيفون */
        .item-price-part { 
            flex: 1; display: flex; align-items: center; justify-content: flex-end; 
            gap: 12px; flex-wrap: nowrap; min-width: 110px; text-align: left;
        }
        
        .old-price { color: #9ca3af; text-decoration: line-through; font-size: 0.8rem; white-space: nowrap; }
        .current-price { color: #dc2626; font-weight: 800; font-size: 1.15rem; white-space: nowrap; }

        .item-action-part { flex: 0.8; display: flex; justify-content: flex-end; }

        .quantity-select { 
            height: 40px; width: 100%; max-width: 100px; border: 2px solid #22c55e; border-radius: 8px; 
            font-weight: bold; background-color: #fff; font-size: 0.85rem; text-align: center;
        }

        .offer-badge { background: #ef4444; color: white; padding: 1px 6px; border-radius: 99px; font-size: 10px; font-weight: bold; margin-top: 2px; }
        .not-available { opacity: 0.5; }
    </style>
</head>
<body class="p-2 md:p-8 text-right" dir="rtl">

    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-2xl p-4 md:p-10 border-4 border-green-500/40">

        <header class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-green-700 mb-4" id="main-title">💰أسعار اليوم💰</h1>
            <div class="mb-6">
                <img src="https://i.ibb.co/3yfhVHXj/1764874410467.png" alt="الشعار" class="mx-auto w-24 h-24 rounded-full border-4 border-green-300 shadow-lg object-cover">
                <p class="text-lg font-bold text-gray-600 mt-2">خُبراء الخضار والفاكهة</p>
                <p id="date-display" class="text-sm font-bold text-blue-700 mt-3 bg-blue-50 inline-block px-4 py-2 rounded-full border border-blue-200"></p>
            </div>
        </header>
        
        <div id="price-list-view">
            <button onclick="toggleView('order-form-view')" class="w-full mb-6 bg-blue-600 text-white font-bold py-4 rounded-xl shadow-xl text-xl active:scale-95 transition">
                🛒 ابدأ طلبك الآن! (نموذج الطلب)
            </button>

            <div class="bg-red-50 text-red-700 font-bold p-3 rounded-xl border-2 border-red-200 mb-8 text-center animate-pulse">
                🔴 يُرجى تحديث الصفحة قبل الطلب 🔴 
            </div>

            <section class="border rounded-xl overflow-hidden shadow-lg mb-10">
                <h2 class="bg-green-600 text-white text-2xl font-bold p-3 text-center">🥬 خضروات 🥦</h2>
                <div id="vegetables-list-static"></div>
            </section>

            <section class="border rounded-xl overflow-hidden shadow-lg mb-10">
                <h2 class="bg-yellow-500 text-white text-2xl font-bold p-3 text-center">🍎 فواكه 🍌</h2>
                <div id="fruits-list-static"></div>
            </section>

            <button onclick="toggleView('order-form-view')" class="w-full mt-4 mb-12 bg-blue-600 text-white font-bold py-4 rounded-xl shadow-xl text-xl active:scale-95 transition">
                🛒 ابدأ طلبك الآن!
            </button>
        </div>

        <div id="order-form-view" style="display: none;">
            <button onclick="toggleView('price-list-view')" class="w-full mb-6 bg-gray-400 text-white font-bold py-3 rounded-xl">🔙 العودة للأسعار</button>
            <form id="order-form" onsubmit="event.preventDefault(); generateWhatsAppOrder();">
                <div id="vegetables-list-interactive" class="border rounded-xl mb-6 overflow-hidden"></div>
                <div id="fruits-list-interactive" class="border rounded-xl mb-6 overflow-hidden"></div>
                <textarea id="notes" rows="4" placeholder="العنوان بالتفصيل ورقم الموبايل..." class="w-full p-4 border rounded-xl text-right"></textarea>
                <button type="submit" class="w-full mt-8 bg-green-600 text-white font-bold py-5 rounded-2xl text-2xl shadow-xl">إرسال الطلب عبر واتساب ✅</button>
            </form>
        </div>

        <footer class="mt-12 pt-6 border-t-2 text-center">
            <div class="bg-yellow-50 p-4 rounded-xl border border-yellow-200 mb-6 font-bold text-gray-700 text-sm">🕒 العمل من 11 ص إلى 5 م (عدا الجمعة)</div>
            
            <a href="http://wa.me/201032872750" class="w-full bg-green-500 text-white font-bold py-4 rounded-2xl inline-block shadow-md mb-4">📨 مراسلة واتساب مباشرة</a>
            
            <a href="https://www.facebook.com/share/1HkZeEoRr3/" class="w-full bg-blue-700 text-white font-bold py-4 rounded-2xl inline-block shadow-md mb-8">🔵 زيارة صفحة الفيسبوك</a>
            
            <div class="mt-6 flex justify-center opacity-70">
                <img src="https://counter1.optistats.ovh/private/freecounterstat.php?c=4c8kqkxygt8km1fw7qfsjmr2ktzj1qwf" border="0" title="عداد الزيارات">
            </div>
        </footer>
    </div>

    <script>
        const productsData = [
            { name: "بصل أحمر", price: 20, unit: "كجم", category: "veg", available: true },
            { name: "ثوم بلدي", price: 40, unit: "كجم", category: "veg", available: true },
            { name: "بطاطس تحمير", price: 20, unit: "كجم", category: "veg", available: true },
            { name: "بطاطس صغيرة", price: 15, unit: "كجم", category: "veg", available: true },
            { name: "باذنجان مكبب", price: 30, unit: "كجم", category: "veg", available: true },
            { name: "خيار", price: 30, unit: "كجم", category: "veg", available: true },
            { name: "كوسة", price: 20, unit: "كجم", category: "veg", available: true },
            { name: "جزر", price: 20, unit: "كجم", category: "veg", available: true },
            { name: "طماطم جامدة", price: 35, unit: "كجم", category: "veg", available: true },
            { name: "ليمون 1", price: 50, unit: "كجم", category: "veg", available: true },
            { name: "ليمون 2", price: 40, unit: "كجم", category: "veg", available: true },
            { name: "فلفل أخضر بارد", price: 40, oldPrice: 50, unit: "كجم", category: "veg", available: true },
            { name: "فلفل أخضر حار", price: 40, unit: "كجم", category: "veg", available: true },
            { name: "فلفل أحمر بارد", price: 60, unit: "كجم", category: "veg", available: true },
            { name: "فلفل ألوان", price: 100, unit: "كجم", category: "veg", available: true },
            { name: "سبانخ", price: 10, unit: "حزمة", category: "veg", available: true },
            { name: "خس بلدي", price: 12.5, unit: "حزمة", category: "veg", available: true },
            { name: "شبت وكسبرة", price: 10, unit: "ربطة", category: "veg", available: true },
            { name: "بقدونس", price: 10, unit: "ربطة", category: "veg", available: true },
            { name: "فجل", price: 5, unit: "ربطة", category: "veg", available: true },
            { name: "جرجير", price: 5, unit: "ربطة", category: "veg", available: true },
            { name: "نعناع", price: 10, unit: "ربطة", category: "veg", available: true },
            { name: "بصل أخضر", price: 10, unit: "ربطة", category: "veg", available: true },
            { name: "كرات مصري", price: 5, unit: "ربطة", category: "veg", available: true },
            { name: "خس كابوتشا", price: 30, unit: "حبة", category: "veg", available: true },
            { name: "زنجبيل فريش", price: 280, unit: "كجم", category: "veg", available: true },
            { name: "بنجر", price: 30, unit: "كجم", category: "veg", available: true },
            { name: "بصل أبيض ", price: 15, unit: "كجم", category: "veg", available: true },
            { name: "كرنب أحمر (سلطة)", price: 35, unit: "حبة", category: "veg", available: true },
            { name: "كرنب أبيض (سلطة)", price: 40, unit: "حبة", category: "veg", available: true },
            { name: "مشروم فريش", price: 50, oldPrice: 60, unit: "طبق", category: "veg", available: true },
            { name: " أرز رويزق 10ك", price: 315, oldPrice: 320, unit: "شيكارة", category: "veg", available: true },
            { name: "موز 1", price: 35, unit: "كجم", category: "fruit", available: true },
            { name: "تفاح أصفر", price: 90, unit: "كجم", category: "fruit", available: true },
            { name: "تفاح سكري", price: 100, unit: "كجم", category: "fruit", available: true },
            { name: "تفاح أحمر إيطالي", price: 130, unit: "كجم", category: "fruit", available: true },
            { name: "فراولة", price: 30, unit: "كجم", category: "fruit", available: true },
            { name: "كيوي", price: 150, unit: "كجم", category: "fruit", available: true },
            { name: "برتقال بصره", price: 30, unit: "كجم", category: "fruit", available: true },
            { name: "جوافة", price: 40, unit: "كجم", category: "fruit", available: true },
            { name: "يوسفي موركت", price: 30, unit: "كجم", category: "fruit", available: true },
            { name: "كنتالوب", price: 35, oldPrice: 40, unit: "كجم", category: "fruit", available: true },
            { name: "تمر القصيم (١ك)", price: 125, unit: "علبة", category: "fruit", available: true },
            { name: "برتقال عصير", price: 20, unit: "كجم", category: "fruit", available: true },
            { name: "خوخ بلدي", price: 100, unit: "كجم", category: "fruit", available: true },
            { name: "خوخ سكري", price: 100, unit: "كجم", category: "fruit", available: true }
        ];

        function init() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true };
            document.getElementById('date-display').innerText = now.toLocaleDateString('ar-EG', options).replace(" في ", " - ");

            let sVeg = '', sFruit = '', iVeg = '', iFruit = '';
            productsData.forEach(p => {
                const badge = p.oldPrice ? `<br><span class="offer-badge">عرض 🔥</span>` : '';
                const priceDiv = `<div class="item-price-part">
                                    ${p.oldPrice ? `<span class="old-price">${p.oldPrice} ج</span>` : ''}
                                    <span class="current-price">${p.price} ج</span>
                                  </div>`;
                
                const sRow = `<div class="flex-row-item ${p.available ? '' : 'not-available'}">
                                <div class="item-name-part">${p.name}${badge}</div>
                                ${p.available ? priceDiv : '<div class="text-red-500 font-bold text-xs">غير متوفر</div>'}
                              </div>`;
                
                const iRow = `<div class="flex-row-item">
                                <div class="item-name-part text-sm">${p.name}</div>
                                <div class="item-action-part">
                                    <select class="quantity-select" data-unit="${p.unit}" data-name="${p.name}"></select>
                                </div>
                              </div>`;

                if (p.category === 'veg') { sVeg += sRow; iVeg += iRow; } else { sFruit += sRow; iFruit += iRow; }
            });
            document.getElementById('vegetables-list-static').innerHTML = sVeg;
            document.getElementById('fruits-list-static').innerHTML = sFruit;
            document.getElementById('vegetables-list-interactive').innerHTML = iVeg;
            document.getElementById('fruits-list-interactive').innerHTML = iFruit;

            document.querySelectorAll('.quantity-select').forEach(s => {
                let opts = '<option value="0">-- طلب --</option>';
                const unit = s.dataset.unit;
                if (unit === 'كجم') {
                    [0.25, 0.5, 0.75, 1, 1.5, 2, 3, 4, 5].forEach(v => opts += `<option value="${v}">${v} كيلو</option>`);
                } else {
                    for(let i=1; i<=10; i++) opts += `<option value="${i}">${i} ${unit}</option>`;
                }
                s.innerHTML = opts;
            });
        }

        function toggleView(v) {
            document.getElementById('price-list-view').style.display = v === 'order-form-view' ? 'none' : 'block';
            document.getElementById('order-form-view').style.display = v === 'order-form-view' ? 'block' : 'none';
            window.scrollTo(0,0);
        }

        function generateWhatsAppOrder() {
            let msg = '📝 *طلب جديد*:\n';
            document.querySelectorAll('.quantity-select').forEach(s => {
                if (s.value != "0") msg += `- ${s.options[s.selectedIndex].text} ${s.dataset.name}\n`;
            });
            msg += `\n📌 *الملاحظات:* ${document.getElementById('notes').value}`;
            window.open(`https://wa.me/201032872750?text=${encodeURIComponent(msg)}`);
        }

        window.onload = init;
    </script>
</body>
</html>
