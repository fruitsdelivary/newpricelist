<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دليفري الخضار والفاكهة - قائمة الأسعار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f7f9fb; }
        .flex-row-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 16px; border-bottom: 1px solid #eee;
        }
        .item-name-part { flex: 2; text-align: right; font-weight: 600; font-size: 1.1rem; }
        .item-price-part { flex: 1.5; text-align: left; display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
        .old-price { color: #9ca3af; text-decoration: line-through; font-size: 0.85rem; font-weight: normal; }
        .current-price { color: #dc2626; font-weight: 800; font-size: 1.25rem; white-space: nowrap; }
    </style>
</head>
<body class="p-2 md:p-6 text-right">

    <div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-xl p-4 border-2 border-green-500">
        
        <header class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-green-700 mb-2">💰 أسعار اليوم 💰</h1>
            <img src="https://i.ibb.co/3yfhVHXj/1764874410467.png" class="mx-auto w-28 h-28 rounded-full border-4 border-green-200 shadow-md object-cover">
            <p class="text-lg font-bold text-gray-500 mt-2">خُبراء الخضار والفاكهة</p>
            <div id="date-display" class="mt-3 bg-blue-600 text-white px-4 py-2 rounded-full inline-block font-bold shadow-md text-sm"></div>
        </header>

        <div id="price-list-view">
            <button onclick="toggleView('order-form-view')" class="w-full mb-6 bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg text-xl active:scale-95 transition">
                🛒 ابدأ طلبك الآن! (نموذج الطلب)
            </button>

            <div class="bg-red-50 text-red-600 font-bold p-3 rounded-xl border border-red-200 mb-6 text-center animate-pulse">
                🔴 يُرجى تحديث الصفحة قبل الطلب 🔴
            </div>

            <section class="border-2 border-green-100 rounded-2xl overflow-hidden mb-8 shadow-sm">
                <h2 class="bg-green-600 text-white text-xl font-bold p-3 text-center">🥬 خضروات 🥦</h2>
                <div id="veg-list"></div>
            </section>

            <section class="border-2 border-yellow-100 rounded-2xl overflow-hidden mb-8 shadow-sm">
                <h2 class="bg-yellow-500 text-white text-xl font-bold p-3 text-center">🍌 فواكه 🍎</h2>
                <div id="fruit-list"></div>
            </section>

            <button onclick="toggleView('order-form-view')" class="w-full mt-4 mb-10 bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg text-xl active:scale-95 transition">
                🛒 ابدأ طلبك الآن!
            </button>
        </div>

        <footer class="mt-10 pt-6 border-t text-center">
            <div class="bg-yellow-50 p-4 rounded-2xl mb-6 font-bold text-gray-700 border border-yellow-200">🕒 العمل من 11 ص إلى 5 م (عدا الجمعة)</div>
            
            <a href="http://wa.me/201032872750" class="w-full bg-green-500 text-white font-bold py-4 rounded-2xl inline-block shadow-md mb-4 text-lg">📨 مراسلة واتساب مباشرة</a>
            
            <a href="https://www.facebook.com/share/1HkZeEoRr3/" class="w-full bg-blue-700 text-white font-bold py-4 rounded-2xl inline-block shadow-md mb-8 text-lg">🔵 زيارة صفحة الفيسبوك</a>
            
            <div class="mt-4 opacity-70">
                <img src="https://counter1.optistats.ovh/private/freecounterstat.php?c=4c8kqkxygt8km1fw7qfsjmr2ktzj1qwf" class="mx-auto">
            </div>
        </footer>
    </div>

    <script>
        const products = [
            { name: "كنتالوب", price: 35, oldPrice: 40, cat: "fruit" },
            { name: "بصل أحمر", price: 20, cat: "veg" },
            { name: "طماطم جامدة", price: 35, cat: "veg" },
            { name: "مشروم فريش", price: 50, oldPrice: 60, cat: "veg" },
            { name: "خوخ سكري", price: 100, cat: "fruit" }
            // أضف بقية الأصناف هنا بنفس الطريقة
        ];

        function init() {
            const now = new Date();
            const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true };
            document.getElementById('date-display').innerText = now.toLocaleDateString('ar-EG', dateOptions);

            let vHTML = '', fHTML = '';
            products.forEach(p => {
                const row = `
                <div class="flex-row-item">
                    <div class="item-name-part">${p.name} ${p.oldPrice ? '<span class="text-[10px] bg-red-500 text-white px-2 py-0.5 rounded-full mr-2">عرض</span>' : ''}</div>
                    <div class="item-price-part">
                        ${p.oldPrice ? `<span class="old-price">${p.oldPrice}</span>` : ''}
                        <span class="current-price">${p.price} ج</span>
                    </div>
                </div>`;
                p.cat === 'veg' ? vHTML += row : fHTML += row;
            });
            document.getElementById('veg-list').innerHTML = vHTML;
            document.getElementById('fruit-list').innerHTML = fHTML;
        }

        function toggleView(v) { window.scrollTo({top:0, behavior:'smooth'}); alert("سيتم فتح نموذج الطلب في التحديث القادم"); }
        
        window.onload = init;
    </script>
</body>
</html>
